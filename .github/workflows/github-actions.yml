name: Github Actions Demo

run-name: ${{github.actor}} está ejecutando un pipeline
on: [push]

jobs:
  saludae-hello-world:
    runs-on: ubuntu-latest
    steps:
        - run: echo "Este job ha sido ejecutado ${{github.event_name}} por ${{github.actor}}"
        - run: echo "El nombre de la rama es ${{github.ref}}. Y el repositorio es ${{github.repository}}"
        - name: Checkout repository
          uses: actions/checkout@v6
        - name: Listar los archivos del repositorio
          run: |
            ls ${{github.workspace}}
