name: Infraestructura global

on:
  workflow_dispatch:
    inputs:
      accion:
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-global
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Entrar a AWS
        uses: ./.github/actions/preparar-terraform
        with:
          rol: ${{ vars.AWS_ROL_LECTURA }}
          carpeta: infra/global
          region: ${{ vars.AWS_REGION }}
          bucket: ${{ vars.TF_ESTADO_BUCKET }}
      - name: Plan
        working-directory: infra/global
        run: terraform plan -input=false -lock=false -no-color

  aplicar:
    name: Aplicar
    needs: plan
    if: inputs.accion == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: global
    steps:
      - uses: actions/checkout@v7
      - name: Entrar a AWS
        uses: ./.github/actions/preparar-terraform
        with:
          rol: ${{ vars.AWS_ROL_DESPLIEGUE }}
          carpeta: infra/global
          region: ${{ vars.AWS_REGION }}
          bucket: ${{ vars.TF_ESTADO_BUCKET }}
      - name: Aplicar
        working-directory: infra/global
        run: terraform apply -input=false -auto-approve
