name: Despliegue a dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: despliegue-dev
  cancel-in-progress: false

jobs:
  cambios:
    name: Qué cambió
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      frontend: ${{ steps.filtro.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filtro
        with:
          filters: |
            backend:
              - 'backend/app/**'
              - 'backend/build-logic/**'
              - 'backend/gradle/**'
              - 'backend/*.kts'
              - 'infra/**'
            frontend:
              - 'frontend/**'
              - 'infra/**'

  construir-funciones:
    name: Construir las funciones
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/empaquetar-funciones
      - uses: actions/upload-artifact@v7
        with:
          name: funciones
          path: backend/funciones/*/build/distributions/*.zip
          retention-days: 1

  construir-frontend:
    name: Construir el frontend
    needs: cambios
    if: needs.cambios.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Compilar
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: frontend/dist
          retention-days: 1

  desplegar:
    name: Desplegar
    needs: [cambios, construir-funciones, construir-frontend]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/desplegar-ambiente.yml
    with:
      ambiente: dev
      version: ${{ github.sha }}
      backend: ${{ needs.cambios.outputs.backend == 'true' }}
      frontend: ${{ needs.cambios.outputs.frontend == 'true' }}

  avisar:
    name: Avisar
    needs: desplegar
    if: failure()
    uses: ./.github/workflows/avisar.yml
    with:
      titulo: Falló el despliegue a dev
    secrets: inherit
