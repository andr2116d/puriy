name: Despliegue a dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: despliegue-dev
  cancel-in-progress: false

jobs:
  cambios:
    name: Qué cambió
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      funciones: ${{ steps.filtro.outputs.funciones }}
      frontend: ${{ steps.filtro.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filtro
        with:
          filters: |
            backend:
              - 'backend/app/**'
              - 'backend/build-logic/**'
              - 'backend/gradle/**'
            funciones:
              - 'backend/funciones/**'
            frontend:
              - 'frontend/**'

  construir-backend:
    name: Construir el backend
    needs: cambios
    if: needs.cambios.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Imagen
        run: echo "Se construye la imagen del backend y se sube a ECR"

  construir-funciones:
    name: Construir las funciones
    needs: cambios
    if: needs.cambios.outputs.funciones == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Paquetes
        run: echo "Se empaquetan las Lambdas y se suben a S3"

  construir-frontend:
    name: Construir el frontend
    needs: cambios
    if: needs.cambios.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Compilar
        run: echo "Se compila el frontend apuntando a la API de dev"

  desplegar:
    name: Desplegar
    needs: [cambios, construir-backend, construir-funciones, construir-frontend]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/desplegar-ambiente.yml
    with:
      ambiente: dev
      version: ${{ github.sha }}
      backend: ${{ needs.cambios.outputs.backend == 'true' }}
      funciones: ${{ needs.cambios.outputs.funciones == 'true' }}
      frontend: ${{ needs.cambios.outputs.frontend == 'true' }}
    secrets: inherit

  avisar:
    name: Avisar
    needs: desplegar
    if: failure()
    uses: ./.github/workflows/avisar.yml
    with:
      titulo: Falló el despliegue a dev
    secrets: inherit
