name: Despliegue a dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: despliegue-dev
  cancel-in-progress: false

jobs:
  cambios:
    name: Qué cambió
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filtro.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filtro
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'infra/**'

  construir-funciones:
    name: Construir las funciones
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/empaquetar-funciones
      - uses: actions/upload-artifact@v7
        with:
          name: funciones
          path: backend/funciones/*/build/distributions/*.zip
          retention-days: 1

  construir-frontend:
    name: Construir el frontend
    needs: cambios
    if: needs.cambios.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Compilar
        run: echo "Se compila el frontend apuntando a la API de dev"

  desplegar:
    name: Desplegar
    needs: [cambios, construir-funciones, construir-frontend]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/desplegar-ambiente.yml
    with:
      ambiente: dev
      version: ${{ github.sha }}
      frontend: ${{ needs.cambios.outputs.frontend == 'true' }}

  avisar:
    name: Avisar
    needs: desplegar
    if: failure()
    uses: ./.github/workflows/avisar.yml
    with:
      titulo: Falló el despliegue a dev
    secrets: inherit
