name: Revisión del PR
run-name: "Revisión del PR #${{ github.event.pull_request.number }}"

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-revision-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  origen:
    name: Origen del PR
    runs-on: ubuntu-latest
    env:
      RAMA_ORIGEN: ${{ github.head_ref }}
    steps:
      - name: A main solo llegan dev o un hotfix
        if: github.base_ref == 'main' && github.head_ref != 'dev' && !startsWith(github.head_ref, 'hotfix/')
        run: |
          echo "A main solo llegan dev o un hotfix, no $RAMA_ORIGEN"
          exit 1
      - name: Un hotfix va a main
        if: github.base_ref == 'dev' && startsWith(github.head_ref, 'hotfix/')
        run: |
          echo "Un hotfix va a main, no a dev"
          exit 1
      - name: Origen correcto
        run: echo "Origen correcto"

  cambios:
    name: Qué cambió
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      funciones: ${{ steps.filtro.outputs.funciones }}
      frontend: ${{ steps.filtro.outputs.frontend }}
      infra: ${{ steps.filtro.outputs.infra }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filtro
        with:
          filters: |
            backend:
              - 'backend/app/**'
              - 'backend/build-logic/**'
              - 'backend/gradle/**'
              - 'backend/*.kts'
              - '.github/workflows/pr-revision.yml'
            funciones:
              - 'backend/funciones/**'
              - 'backend/build-logic/**'
              - 'backend/gradle/**'
              - 'backend/*.kts'
              - '.github/workflows/pr-revision.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/pr-revision.yml'
            infra:
              - 'infra/**'
              - '.github/actions/preparar-terraform/**'
              - '.github/workflows/pr-revision.yml'

  convenciones:
    name: Convenciones
    needs: cambios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Título, rama, commits, archivos y migraciones
        env:
          TITULO: ${{ github.event.pull_request.title }}
          RAMA: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/revisar_convenciones.py

  backend:
    name: Backend
    needs: cambios
    if: needs.cambios.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Formato
        run: ./gradlew spotlessCheck
      - name: Compilar, analizar y probar
        run: ./gradlew :app:check
      - name: Guardar el reporte si falló
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-backend
          path: backend/app/build/reports/tests/
          retention-days: 7

  funciones:
    name: Funciones
    needs: cambios
    if: needs.cambios.outputs.funciones == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Formato
        run: ./gradlew spotlessCheck
      - name: Probar y empaquetar las tres Lambdas
        run: >-
          ./gradlew
          :funciones:generar-boleto:check :funciones:generar-boleto:empaquetar
          :funciones:enviar-correo:check :funciones:enviar-correo:empaquetar
          :funciones:publicar-asientos:check :funciones:publicar-asientos:empaquetar

  frontend:
    name: Frontend
    needs: cambios
    if: needs.cambios.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Instalar
        run: pnpm install --frozen-lockfile
      - name: Lint, tipos, pruebas y build
        run: pnpm check

  infra:
    name: Infraestructura
    needs: cambios
    if: needs.cambios.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Formato
        run: terraform fmt -check -recursive -diff infra
      - name: Validar cada ambiente
        run: |
          find infra/ambientes -name '*.tf' -printf '%h\n' | sort -u | while read -r carpeta; do
            echo "Validando $carpeta"
            terraform -chdir="$carpeta" init -backend=false -input=false
            terraform -chdir="$carpeta" validate
          done

  seguridad:
    name: Seguridad
    needs: cambios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Dependencias
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
      - name: Secretos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  veredicto:
    name: Veredicto
    if: always()
    needs: [origen, cambios, convenciones, backend, funciones, frontend, infra, seguridad]
    runs-on: ubuntu-latest
    steps:
      - name: Algo falló
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Hay revisiones fallidas, el PR no se puede integrar"
          exit 1
      - name: Listo
        run: echo "Todo pasó, el PR se puede integrar"
