name: Cambios fuera de Terraform

on:
  schedule:
    # Lunes 08:00 en Perú
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  comparar:
    name: Comparar ${{ matrix.ambiente }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - ambiente: global
            carpeta: infra/global
          - ambiente: dev
            carpeta: infra/ambientes/dev
          - ambiente: prod
            carpeta: infra/ambientes/prod
    env:
      AWS_ROL: ${{ vars.AWS_ROL_LECTURA }}
      CARPETA: ${{ matrix.carpeta }}
    steps:
      - uses: actions/checkout@v7
      - name: Buscar el Terraform del ambiente
        id: terraform
        run: |
          if [ -n "$AWS_ROL" ] && compgen -G "$CARPETA/*.tf" > /dev/null; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$CARPETA todavía no tiene Terraform o falta AWS_ROL_LECTURA"
          fi
      - name: Entrar a AWS
        if: steps.terraform.outputs.existe == 'true'
        uses: ./.github/actions/preparar-terraform
        with:
          rol: ${{ vars.AWS_ROL_LECTURA }}
          carpeta: ${{ matrix.carpeta }}
          region: ${{ vars.AWS_REGION }}
          bucket: ${{ vars.TF_STATE_BUCKET }}
      # Con -detailed-exitcode, cualquier diferencia con AWS hace fallar el paso
      - name: Comparar
        if: steps.terraform.outputs.existe == 'true'
        working-directory: ${{ matrix.carpeta }}
        run: terraform plan -input=false -lock=false -no-color -detailed-exitcode

  avisar:
    name: Avisar
    needs: comparar
    if: failure()
    uses: ./.github/workflows/avisar.yml
    with:
      titulo: Hay cambios fuera de Terraform
    secrets: inherit
