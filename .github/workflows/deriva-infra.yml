name: Cambios fuera de Terraform

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparar:
    name: Comparar dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/empaquetar-funciones
      - name: Entrar a AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Iniciar Terraform
        uses: ./.github/actions/preparar-terraform
        with:
          carpeta: infra/ambientes/dev
          region: ${{ vars.AWS_REGION }}
          bucket: ${{ vars.TF_STATE_BUCKET }}
      - name: Comparar
        working-directory: infra/ambientes/dev
        run: terraform plan -input=false -lock=false -no-color -detailed-exitcode

  avisar:
    name: Avisar
    needs: comparar
    if: failure()
    uses: ./.github/workflows/avisar.yml
    with:
      titulo: Hay cambios fuera de Terraform
    secrets: inherit
