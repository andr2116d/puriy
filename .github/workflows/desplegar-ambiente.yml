name: Desplegar ambiente

on:
  workflow_call:
    inputs:
      ambiente:
        required: true
        type: string
      version:
        required: true
        type: string
      backend:
        type: boolean
        default: true
      funciones:
        type: boolean
        default: true
      frontend:
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

env:
  AMBIENTE: ${{ inputs.ambiente }}
  VERSION: ${{ inputs.version }}
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  plan:
    name: Plan (${{ inputs.ambiente }})
    runs-on: ubuntu-latest
    env:
      AWS_ROL: ${{ vars.AWS_ROL_LECTURA }}
      CARPETA: infra/ambientes/${{ inputs.ambiente }}
    outputs:
      hay-terraform: ${{ steps.terraform.outputs.existe }}
    steps:
      - uses: actions/checkout@v7
      - name: Buscar el Terraform del ambiente
        id: terraform
        run: |
          if [ -n "$AWS_ROL" ] && compgen -G "$CARPETA/*.tf" > /dev/null; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$AMBIENTE todavía no tiene Terraform o falta AWS_ROL_LECTURA"
          fi
      - name: Entrar a AWS
        if: steps.terraform.outputs.existe == 'true'
        uses: ./.github/actions/preparar-terraform
        with:
          rol: ${{ vars.AWS_ROL_LECTURA }}
          carpeta: infra/ambientes/${{ inputs.ambiente }}
          region: ${{ vars.AWS_REGION }}
          bucket: ${{ vars.TF_STATE_BUCKET }}
      - name: Plan
        if: steps.terraform.outputs.existe == 'true'
        working-directory: ${{ env.CARPETA }}
        run: terraform plan -input=false -lock=false -no-color

  aplicar:
    name: Aplicar (${{ inputs.ambiente }})
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente }}
    steps:
      - uses: actions/checkout@v7
      - name: Entrar a AWS
        if: needs.plan.outputs.hay-terraform == 'true'
        uses: ./.github/actions/preparar-terraform
        with:
          rol: ${{ vars.AWS_ROLE_ARN }}
          carpeta: infra/ambientes/${{ inputs.ambiente }}
          region: ${{ vars.AWS_REGION }}
          bucket: ${{ vars.TF_STATE_BUCKET }}
      - name: Aplicar
        if: needs.plan.outputs.hay-terraform == 'true'
        working-directory: infra/ambientes/${{ inputs.ambiente }}
        run: terraform apply -input=false -auto-approve
      - name: Backend
        if: inputs.backend
        run: echo "Se reemplazan las instancias del backend por la versión $VERSION"
      - name: Funciones
        if: inputs.funciones
        run: echo "Se actualizan las Lambdas a la versión $VERSION"

  frontend:
    name: Frontend (${{ inputs.ambiente }})
    needs: aplicar
    if: inputs.frontend
    runs-on: ubuntu-latest
    steps:
      - name: Publicar
        run: echo "Se sube el frontend a S3 y se limpia la caché de CloudFront"

  humo:
    name: Pruebas de humo (${{ inputs.ambiente }})
    needs: [aplicar, frontend]
    if: always() && needs.aplicar.result == 'success' && needs.frontend.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Probar
        run: echo "Se comprueba que la API y la página de $AMBIENTE respondan"
