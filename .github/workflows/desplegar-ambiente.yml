name: Desplegar ambiente

on:
  workflow_call:
    inputs:
      ambiente:
        required: true
        type: string
      version:
        required: true
        type: string
      backend:
        type: boolean
        default: true
      frontend:
        type: boolean
        default: true

permissions:
  contents: read

env:
  AMBIENTE: ${{ inputs.ambiente }}
  VERSION: ${{ inputs.version }}
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  plan:
    name: Plan (${{ inputs.ambiente }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente }}
    permissions:
      contents: read
      id-token: write
    env:
      CARPETA: infra/ambientes/${{ inputs.ambiente }}
    outputs:
      hay-terraform: ${{ steps.terraform.outputs.existe }}
    steps:
      - uses: actions/checkout@v7
      - name: Entrar a AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Comprobar el rol
        run: aws sts get-caller-identity --query Arn --output text
      - name: Buscar el Terraform del ambiente
        id: terraform
        run: |
          if compgen -G "$CARPETA/*.tf" > /dev/null; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$AMBIENTE todavía no tiene Terraform"
          fi
      - name: Traer las funciones
        if: steps.terraform.outputs.existe == 'true'
        uses: actions/download-artifact@v8
        with:
          name: funciones
          path: backend/funciones
      - name: Iniciar Terraform
        if: steps.terraform.outputs.existe == 'true'
        uses: ./.github/actions/preparar-terraform
        with:
          carpeta: infra/ambientes/${{ inputs.ambiente }}
          region: ${{ vars.AWS_REGION }}
          bucket: ${{ vars.TF_STATE_BUCKET }}
      - name: Plan
        if: steps.terraform.outputs.existe == 'true'
        working-directory: ${{ env.CARPETA }}
        run: terraform plan -input=false -lock=false -no-color

  aplicar:
    name: Aplicar (${{ inputs.ambiente }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.ambiente }}
    permissions:
      contents: read
      id-token: write
    outputs:
      bucket-web: ${{ steps.salidas.outputs.bucket-web }}
      distribucion: ${{ steps.salidas.outputs.distribucion }}
      url: ${{ steps.salidas.outputs.url }}
      funciones: ${{ steps.salidas.outputs.funciones }}
      repositorio: ${{ steps.salidas.outputs.repositorio }}
      grupo: ${{ steps.salidas.outputs.grupo }}
    steps:
      - uses: actions/checkout@v7
      - name: Entrar a AWS
        if: needs.plan.outputs.hay-terraform == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Traer las funciones
        if: needs.plan.outputs.hay-terraform == 'true'
        uses: actions/download-artifact@v8
        with:
          name: funciones
          path: backend/funciones
      - name: Iniciar Terraform
        if: needs.plan.outputs.hay-terraform == 'true'
        uses: ./.github/actions/preparar-terraform
        with:
          carpeta: infra/ambientes/${{ inputs.ambiente }}
          region: ${{ vars.AWS_REGION }}
          bucket: ${{ vars.TF_STATE_BUCKET }}
      - name: Aplicar
        if: needs.plan.outputs.hay-terraform == 'true'
        working-directory: infra/ambientes/${{ inputs.ambiente }}
        run: terraform apply -input=false -auto-approve
      - name: Leer las salidas
        id: salidas
        if: needs.plan.outputs.hay-terraform == 'true'
        working-directory: infra/ambientes/${{ inputs.ambiente }}
        run: |
          {
            echo "bucket-web=$(terraform output -raw bucket_web)"
            echo "distribucion=$(terraform output -raw distribucion_id)"
            echo "url=$(terraform output -raw url_web)"
            echo "funciones=$(terraform output -json funciones | jq -r 'join(" ")')"
            echo "repositorio=$(terraform output -raw repositorio_url)"
            echo "grupo=$(terraform output -raw grupo_autoescalado)"
          } >> "$GITHUB_OUTPUT"

  imagen:
    name: Imagen (${{ inputs.ambiente }})
    needs: aplicar
    if: inputs.backend && needs.aplicar.outputs.repositorio != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: ${{ inputs.ambiente }}
    permissions:
      contents: read
      id-token: write
    env:
      GRUPO: ${{ needs.aplicar.outputs.grupo }}
      REPOSITORIO: ${{ needs.aplicar.outputs.repositorio }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compilar
        working-directory: backend
        run: ./gradlew :app:bootJar
      - name: Entrar a AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Subir la imagen
        working-directory: backend/app
        run: |
          docker build -t "$REPOSITORIO:actual" -t "$REPOSITORIO:$VERSION" .
          docker push --all-tags "$REPOSITORIO"
      - name: Renovar las EC2
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$GRUPO" \
            --preferences MinHealthyPercentage=50

  frontend:
    name: Frontend (${{ inputs.ambiente }})
    needs: aplicar
    if: inputs.frontend && needs.aplicar.outputs.bucket-web != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.ambiente }}
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: ${{ needs.aplicar.outputs.bucket-web }}
      DISTRIBUCION: ${{ needs.aplicar.outputs.distribucion }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web
      - name: Entrar a AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publicar
        run: |
          aws s3 sync web "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUCION" --paths '/*'

  humo:
    name: Pruebas de humo (${{ inputs.ambiente }})
    needs: [aplicar, imagen, frontend]
    if: always() && needs.aplicar.outputs.url != '' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.ambiente }}
    permissions:
      contents: read
      id-token: write
    env:
      FUNCIONES: ${{ needs.aplicar.outputs.funciones }}
      URL: ${{ needs.aplicar.outputs.url }}
    steps:
      - name: Web
        run: curl -fsS -o /dev/null --retry 20 --retry-delay 15 --retry-all-errors "$URL"
      - name: API
        run: curl -fsS -o /dev/null --retry 40 --retry-delay 15 --retry-all-errors "$URL/api/v1/terminales"
      - name: Entrar a AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Lambdas
        run: |
          for funcion in $FUNCIONES; do
            error=$(aws lambda invoke --function-name "$funcion" --cli-binary-format raw-in-base64-out \
              --payload '{}' --query FunctionError --output text /tmp/respuesta.json)
            echo "$funcion: $(cat /tmp/respuesta.json)"
            [ "$error" = "None" ]
          done
