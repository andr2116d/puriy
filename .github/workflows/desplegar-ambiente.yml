name: Desplegar ambiente

on:
  workflow_call:
    inputs:
      ambiente:
        required: true
        type: string
      version:
        required: true
        type: string
      frontend:
        type: boolean
        default: true

permissions:
  contents: read

env:
  AMBIENTE: ${{ inputs.ambiente }}
  VERSION: ${{ inputs.version }}
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  plan:
    name: Plan (${{ inputs.ambiente }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente }}
    permissions:
      contents: read
      id-token: write
    env:
      CARPETA: infra/ambientes/${{ inputs.ambiente }}
    outputs:
      hay-terraform: ${{ steps.terraform.outputs.existe }}
    steps:
      - uses: actions/checkout@v7
      - name: Entrar a AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Comprobar el rol
        run: aws sts get-caller-identity --query Arn --output text
      - name: Buscar el Terraform del ambiente
        id: terraform
        run: |
          if compgen -G "$CARPETA/*.tf" > /dev/null; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$AMBIENTE todavía no tiene Terraform"
          fi
      - name: Traer las funciones
        if: steps.terraform.outputs.existe == 'true'
        uses: actions/download-artifact@v8
        with:
          name: funciones
          path: backend/funciones
      - name: Iniciar Terraform
        if: steps.terraform.outputs.existe == 'true'
        uses: ./.github/actions/preparar-terraform
        with:
          carpeta: infra/ambientes/${{ inputs.ambiente }}
          region: ${{ vars.AWS_REGION }}
          bucket: ${{ vars.TF_STATE_BUCKET }}
      - name: Plan
        if: steps.terraform.outputs.existe == 'true'
        working-directory: ${{ env.CARPETA }}
        run: terraform plan -input=false -lock=false -no-color

  aplicar:
    name: Aplicar (${{ inputs.ambiente }})
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Entrar a AWS
        if: needs.plan.outputs.hay-terraform == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Traer las funciones
        if: needs.plan.outputs.hay-terraform == 'true'
        uses: actions/download-artifact@v8
        with:
          name: funciones
          path: backend/funciones
      - name: Iniciar Terraform
        if: needs.plan.outputs.hay-terraform == 'true'
        uses: ./.github/actions/preparar-terraform
        with:
          carpeta: infra/ambientes/${{ inputs.ambiente }}
          region: ${{ vars.AWS_REGION }}
          bucket: ${{ vars.TF_STATE_BUCKET }}
      - name: Aplicar
        if: needs.plan.outputs.hay-terraform == 'true'
        working-directory: infra/ambientes/${{ inputs.ambiente }}
        run: terraform apply -input=false -auto-approve

  frontend:
    name: Frontend (${{ inputs.ambiente }})
    needs: aplicar
    if: inputs.frontend
    runs-on: ubuntu-latest
    steps:
      - name: Publicar
        run: echo "Se sube el frontend a S3 y se limpia la caché de CloudFront"

  humo:
    name: Pruebas de humo (${{ inputs.ambiente }})
    needs: [aplicar, frontend]
    if: always() && needs.aplicar.result == 'success' && needs.frontend.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Probar
        run: echo "Se comprueba que la API y la página de $AMBIENTE respondan"
