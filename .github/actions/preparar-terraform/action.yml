name: Preparar Terraform
description: Instala Terraform e inicia una carpeta de infra

inputs:
  carpeta:
    description: Carpeta de Terraform
    required: true
  region:
    description: Región de AWS
    required: true
  bucket:
    description: Bucket del estado
    required: true

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: false
    - name: Iniciar Terraform
      shell: bash
      working-directory: ${{ inputs.carpeta }}
      env:
        BUCKET: ${{ inputs.bucket }}
        CARPETA: ${{ inputs.carpeta }}
        REGION: ${{ inputs.region }}
      run: >-
        terraform init -input=false
        -backend-config="bucket=$BUCKET"
        -backend-config="key=${CARPETA#infra/}/terraform.tfstate"
        -backend-config="region=$REGION"
