spring:
  application:
    name: puriy
  threads:
    virtual:
      enabled: true
  jooq:
    sql-dialect: postgres
  lifecycle:
    timeout-per-shutdown-phase: 120s
  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

puriy:
  reservas:
    conexiones:
      escala-minima: 1h
      escala-maxima: 12h
    liberacion:
      habilitada: true
      cada: PT30S
      lote: 200
    canales:
      cliente:
        retencion: 10m
        maximo-asientos: 6
        cierre-antes-del-paso: 30m
      invitado:
        retencion: 8m
        maximo-asientos: 6
        cierre-antes-del-paso: 30m
      agente:
        retencion: 30m
        maximo-asientos: 20
        cierre-antes-del-paso: 0m

