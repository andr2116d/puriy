spring:
  application:
    name: puriy
  threads:
    virtual:
      enabled: true
  jooq:
    sql-dialect: postgres
  lifecycle:
    timeout-per-shutdown-phase: 120s
  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
